<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplicación web didáctica para la gestión de contactos (CRUD) con HTML5, CSS3, JS Vanilla y Flask.">
    <title>Agenda de Contactos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Encabezado Principal -->
    <header class="app-header">
        <div class="header-container">
            <h1>Agenda de Contactos</h1>
            <p>Gestión eficiente de contactos y repaso interactivo de conceptos HTTP & Web</p>
        </div>
    </header>

    <main class="app-main">
        <!-- Formulario para Agregar Contacto -->
        <section class="card form-section" aria-labelledby="form-heading">
            <h2 id="form-heading">Nuevo Contacto</h2>
            <form id="contact-form" novalidate>
                <div class="form-group">
                    <label for="nombre">Nombre Completo <span class="required-star">*</span></label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej: María Pérez" autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono <span class="required-star">*</span></label>
                    <input type="tel" id="telefono" name="telefono" required placeholder="Ej: +54 9 11 1234-5678" autocomplete="tel">
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="Ej: maria@ejemplo.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="categoria">Categoría</label>
                    <select id="categoria" name="categoria">
                        <option value="Personal">Personal</option>
                        <option value="Trabajo">Trabajo</option>
                        <option value="Familia">Familia</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary" id="btn-submit">
                    Guardar Contacto
                </button>
            </form>
        </section>

        <!-- Seccion de Filtro / Busqueda y Lista de Contactos -->
        <section class="card list-section" aria-labelledby="list-heading">
            <div class="list-header">
                <h2 id="list-heading">Lista de Contactos</h2>
                <div class="search-box">
                    <label for="search-input" class="visually-hidden">Buscar contactos</label>
                    <input type="search" id="search-input" placeholder="Buscar por nombre, teléfono o email..." autocomplete="off">
                </div>
            </div>

            <!-- Tabla de Contactos -->
            <div class="table-responsive">
                <table class="contacts-table">
                    <thead>
                        <tr>
                            <th scope="col">Nombre</th>
                            <th scope="col">Teléfono</th>
                            <th scope="col">Email</th>
                            <th scope="col">Categoría</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="contacts-table-body">
                        <!-- Fila de ejemplo / placeholder inicial -->
                        <tr>
                            <td>Ejemplo Contacto</td>
                            <td>+54 9 11 0000-0000</td>
                            <td>ejemplo@correo.com</td>
                            <td><span class="badge badge-personal">Personal</span></td>
                            <td class="actions-cell">
                                <button type="button" class="btn-icon btn-edit" title="Editar contacto" aria-label="Editar contacto">✏️</button>
                                <button type="button" class="btn-icon btn-delete" title="Eliminar contacto" aria-label="Eliminar contacto">🗑️</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Estado vacio si no hay contactos -->
            <div id="empty-state" class="empty-state hidden">
                <p>No se encontraron contactos en la agenda.</p>
            </div>
        </section>
    </main>

    <!-- Contenedor para Componentes de Interfaz UI (Modal y Toasts) -->
    <!-- Modal de Edicion / Confirmacion -->
    <div id="modal-backdrop" class="modal-backdrop hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-card">
            <header class="modal-header">
                <h3 id="modal-title">Editar Contacto</h3>
                <button type="button" class="modal-close" id="modal-close-btn" aria-label="Cerrar modal">&times;</button>
            </header>
            <div class="modal-body">
                <form id="edit-contact-form" novalidate>
                    <input type="hidden" id="edit-id" name="id">
                    
                    <div class="form-group">
                        <label for="edit-nombre">Nombre Completo <span class="required-star">*</span></label>
                        <input type="text" id="edit-nombre" name="nombre" required placeholder="Ej: María Pérez">
                    </div>

                    <div class="form-group">
                        <label for="edit-telefono">Teléfono <span class="required-star">*</span></label>
                        <input type="tel" id="edit-telefono" name="telefono" required placeholder="Ej: +54 9 11 1234-5678">
                    </div>

                    <div class="form-group">
                        <label for="edit-email">Correo Electrónico</label>
                        <input type="email" id="edit-email" name="email" placeholder="Ej: maria@ejemplo.com">
                    </div>

                    <div class="form-group">
                        <label for="edit-categoria">Categoría</label>
                        <select id="edit-categoria" name="categoria">
                            <option value="Personal">Personal</option>
                            <option value="Trabajo">Trabajo</option>
                            <option value="Familia">Familia</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" id="modal-cancel-btn">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="modal-save-btn">Actualizar Contacto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Contenedor de Avisos / Toast Notifications -->
    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true">
        <!-- Los avisos tipo toast se insertaran dinamicamente aqui -->
    </div>
</body>
</html>
